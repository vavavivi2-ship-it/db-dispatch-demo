<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB 분배 전산망 체험판</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --line: #dfe2e7; --text: #1d2330; --muted: #6b7280; --brand: #1f4fd1; --brand-soft: #e8eefc;
  --danger: #c0392b; --danger-soft: #fdecea; --warn: #b7791f; --warn-soft: #fff6e0; --ok: #1e7f4f; --ok-soft: #e6f5ec;
  --radius: 8px; --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; }
button:hover { border-color: #b8bec9; }
button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
button.link { border: 0; background: none; color: var(--brand); padding: 0 4px; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; }
textarea { width: 100%; resize: vertical; }
label { display: inline-flex; gap: 6px; align-items: center; }
h1 { font-size: 18px; margin: 0; } h2 { font-size: 16px; margin: 0 0 12px; } h3 { font-size: 14px; margin: 16px 0 8px; }
.muted { color: var(--muted); } .small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.stack > * + * { margin-top: 10px; }

/* 로그인 */
.login { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; }
.login h1 { margin-bottom: 4px; } .login p { margin: 0 0 20px; }
.login input { width: 100%; margin-bottom: 10px; padding: 9px 10px; }
.login button { width: 100%; padding: 9px; }
.err { color: var(--danger); min-height: 20px; font-size: 13px; }

/* 틀 */
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; background: var(--danger); color: #fff; margin-left: 4px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.notice { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
.notice.warn { background: var(--warn-soft); color: #7a5410; border: 1px solid #f1d9a6; }
.notice.danger { background: var(--danger-soft); color: #8e2a1f; border: 1px solid #f3c2bb; }
.notice.ok { background: var(--ok-soft); color: #155c39; border: 1px solid #b9e2ca; }

/* 상태 칩 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); border-radius: 16px; padding: 3px 10px; background: #fff; font-size: 13px; }
.chip b { margin-left: 4px; }
.chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.st { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #eef0f3; white-space: nowrap; }
.st.s-연락대기 { background: #e8eefc; color: #1f4fd1; } .st.s-부재중, .st.s-재연락 { background: var(--warn-soft); color: #8a5a10; }
.st.s-예약성공, .st.s-방문성공, .st.s-결제성공, .st.s-리워드 { background: var(--ok-soft); color: var(--ok); }
.st.s-예약실패, .st.s-방문취소, .st.s-결제실패, .st.s-결번 { background: var(--danger-soft); color: var(--danger); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: #fdecea; color: var(--danger); margin-left: 4px; }
.tag.blue { background: var(--brand-soft); color: var(--brand); }

/* 표 */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; background: #fff; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfc; position: sticky; top: 0; white-space: nowrap; }
tbody tr:hover { background: #f8f9fb; }
tbody tr.sel { background: var(--brand-soft); }
tr.click { cursor: pointer; }
td.phone { font-variant-numeric: tabular-nums; user-select: none; white-space: nowrap; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; }

/* 목록 + 상세 */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; align-items: start; }
.split.nodetail { grid-template-columns: 1fr; }
.detail { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
.detail .big { font-size: 20px; font-weight: 700; }
.detail .phonebox { font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: .5px; user-select: none; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 13px; }
.kv .k { color: var(--muted); }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { border-left: 3px solid var(--line); padding: 4px 0 6px 10px; margin-bottom: 8px; font-size: 13px; }
.notes li .meta { color: var(--muted); font-size: 12px; }
.bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px; margin: 10px -16px -16px; border-radius: 0 0 var(--radius) var(--radius); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 16px; }
.field { display: flex; flex-direction: column; align-items: stretch; gap: 4px; font-size: 13px; }
.field > span { color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; }
.req::after { content: " *"; color: var(--danger); }

/* 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(15, 20, 30, .45); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal { background: #fff; border-radius: var(--radius); padding: 20px; width: min(480px, 92vw); max-height: 88vh; overflow: auto; }
.modal h2 { margin-bottom: 8px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
#toast.on { opacity: .95; }

/* ===== 틀: 위 막대 + 왼쪽 메뉴 (참고 화면 방식) ===== */
:root { --side: 210px; --top: 52px; --bg: #f5f6f8; --brand: #1a5cff; --brand-soft: #eaf0ff; }
.shell { min-height: 100vh; }
.top { position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #fff; border-bottom: 1px solid var(--line); z-index: 20; }
.brand { font-weight: 800; font-size: 19px; color: var(--brand); letter-spacing: -.3px; }
.brand-sub { color: var(--muted); font-size: 12px; border-left: 1px solid var(--line); padding-left: 10px; }
.who { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; margin-right: 6px; }
.iconbtn { border: 0; background: none; padding: 6px; display: inline-flex; align-items: center; justify-content: center; color: #374151; border-radius: 8px; }
.iconbtn:hover { background: #f1f3f6; }
.iconbtn.boxed { border: 1px solid var(--line); background: #fff; width: 40px; height: 40px; }
.side { position: fixed; top: var(--top); bottom: 0; left: 0; width: var(--side); background: #fff; border-right: 1px solid var(--line); padding: 14px 0; overflow-y: auto; z-index: 10; transition: transform .15s; }
.side button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 0; background: none; padding: 11px 20px; color: #374151; text-align: left; font-size: 14px; border-right: 3px solid transparent; }
.side button:hover { background: #f7f8fa; }
.side button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; border-right-color: var(--brand); }
.page { margin-left: var(--side); padding: calc(var(--top) + 18px) 24px 80px; transition: margin .15s; }
.nav-closed .side { transform: translateX(-100%); }
.nav-closed .page { margin-left: 0; }
.title { font-size: 24px; font-weight: 800; margin: 6px 0 18px; letter-spacing: -.4px; }
main.content { padding: 0; max-width: none; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.grow { flex: 1; }

/* 기간 막대 */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 7px; font-size: 13px; color: #374151; }
.seg button.on { background: var(--brand); color: #fff; font-weight: 700; }
.range { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; height: 40px; }
.range b { font-size: 14px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.pop { position: absolute; z-index: 70; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 10px 30px rgba(20, 30, 50, .14); }

/* 필터 카드 */
.facets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.facets.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fcard { padding: 16px; height: 210px; display: flex; flex-direction: column; gap: 10px; }
.fcard b { font-size: 13px; }
.fsearch { width: 100%; border-radius: 8px; font-size: 13px; }
.flist { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.fitem { display: flex; gap: 10px; align-items: center; padding: 5px 2px; font-size: 14px; cursor: pointer; border-radius: 6px; }
.fitem input { width: 20px; height: 20px; margin: 0; accent-color: var(--brand); }
.fitem.on { color: var(--brand); font-weight: 600; }
.pill { background: #f1f3f6; color: var(--muted); border-radius: 10px; font-size: 12px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 상태 줄 */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(78px, 1fr); background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; margin-bottom: 18px; }
.strip .cell { border: 0; border-right: 1px solid #eef0f3; border-radius: 0; background: #fff; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.strip .cell span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.strip .cell b { font-size: 15px; font-variant-numeric: tabular-nums; }
.strip .cell.on { background: #eef0f4; }
.strip .cell.on span { color: var(--text); font-weight: 600; }

/* 다운로드·검색 줄 */
.actions { margin-bottom: 12px; gap: 10px; }
button.dark { background: #161b26; color: #fff; border-color: #161b26; display: inline-flex; gap: 6px; align-items: center; padding: 9px 16px; border-radius: 8px; font-weight: 700; }
.toggle { font-size: 13px; color: #374151; }
.searchbox { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px 0 4px; width: 330px; }
.searchbox input { border: 0; flex: 1; padding: 10px 8px; outline: none; }

/* 목록 표 */
.tablecard { padding: 0; overflow: hidden; }
table.list th { background: #f7f8fa; text-align: center; font-size: 12px; padding: 12px 8px; line-height: 1.35; }
table.list td { text-align: center; padding: 12px 8px; font-size: 13px; }
table.list td.person { text-align: center; }
table.list .sub { color: var(--muted); font-size: 11px; }
table.list td .sub { font-size: 12px; }
table.list td.date2 div { white-space: nowrap; line-height: 1.35; }
table.list .empty { padding: 40px; color: var(--muted); }
.small-btn { font-size: 12px; padding: 5px 10px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.small-btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.vst { font-size: 12px; } .vst.v-방문 { color: var(--ok); font-weight: 600; } .vst.v-부도부재, .vst.v-최종취소 { color: var(--danger); } .vst.v-예약취소 { color: var(--warn); }
.tablecard .pager { padding: 12px 16px; border-top: 1px solid var(--line); margin: 0; }
.selbar { position: fixed; left: calc(var(--side) + 24px); right: 24px; bottom: 16px; display: none; gap: 10px; align-items: center; background: #161b26; color: #fff; padding: 10px 14px; border-radius: 12px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.selbar.on { display: flex; }
.selbar select { min-width: 140px; }
.selbar .link { color: #9db7ff; }
.nav-closed .selbar { left: 24px; }

/* 고객관리 창 */
.drawer-bg { position: fixed; inset: 0; background: rgba(15, 20, 30, .45); z-index: 45; display: flex; align-items: center; justify-content: center; }
.drawer.cm { width: min(1000px, 96vw); height: min(780px, 94vh); background: #fff; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.cm-head { display: flex; align-items: flex-start; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
.cm-head h2 { font-size: 22px; margin: 0 0 6px; font-weight: 800; }
.banner { display: inline-block; background: #fff1e6; color: #d4580a; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; margin-right: 6px; }
.banner.red { background: #fdecea; color: var(--danger); }
.cm-body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.cm-left { padding: 6px 22px 20px; overflow-y: auto; }
.cm-right { background: #f5f6f8; padding: 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.cm-sec { border-bottom: 1px solid var(--line); padding: 16px 0; }
.cm-sec h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
.kvline { line-height: 1.8; }
.pre { white-space: pre-wrap; }
.ff { display: flex; flex-direction: column; gap: 8px; }
.ff > label { font-size: 13px; font-weight: 700; }
.ff input, .ff select, .ff textarea { width: 100%; padding: 11px 14px; border-radius: 10px; background: #fff; }
.nowrap2 { flex-wrap: nowrap; } .nowrap2 input { flex: 1; min-width: 0; }
.cm-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: #fff; }
.cm-foot button { padding: 8px 18px; border-radius: 8px; }
.phonebox { font-variant-numeric: tabular-nums; user-select: none; }

@media (max-width: 1200px) { .facets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .side { transform: translateX(-100%); } .page { margin-left: 0; } .nav-closed .side { transform: none; } .cm-body { grid-template-columns: 1fr; } .selbar { left: 12px; right: 12px; } }

/* 화면 워터마크 (계정명·시각) — 화면 촬영 억제 */
#watermark { position: fixed; inset: 0; pointer-events: none; z-index: 40; background-repeat: repeat; opacity: 1; }

@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } .detail { position: static; max-height: none; } }
/* 인쇄로 명단을 빼 가지 못하도록 */
@media print { body * { display: none !important; } body::after { content: "인쇄할 수 없는 화면입니다"; display: block; } }
[hidden] { display: none !important; }
.selbar select, .selbar button:not(.primary):not(.link) { color: var(--text); background: #fff; }
.ff .toggle { display: flex; flex-direction: row; justify-content: flex-start; align-items: center; gap: 8px; font-weight: 500; }
.ff .toggle input { width: 18px; height: 18px; padding: 0; flex: none; accent-color: var(--brand); }
table.list .phone { white-space: nowrap; }
@media (max-width: 860px) { .page { padding: calc(var(--top) + 12px) 12px 80px; } .facets, .facets.two { grid-template-columns: 1fr 1fr; } .fcard { height: 170px; } .searchbox { width: 100%; } .who { display: none; } }
.cm-foot button { white-space: nowrap; }
@media (max-width: 860px) {
  .drawer.cm { width: 100vw; height: 100dvh; border-radius: 0; }
  .cm-body { display: block; overflow-y: auto; }
  .cm-left, .cm-right { overflow: visible; }
  .cm-right { padding: 18px; }
  .cm-foot { gap: 6px; padding: 10px; }
  .cm-foot button { padding: 8px 10px; font-size: 13px; }
  .cm-foot .grow { display: none; }
  .cm-foot button.primary { flex: 1; }
}

/* ===== 휴대폰 (상담사 회사 지급폰, 사무실 와이파이 안 — 2026-11-07) ===== */
.cards, .facet-toggle { display: none; }
.lcard { padding: 14px 14px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.lcard.sel { background: var(--brand-soft); }
.lc-top, .lc-mid, .lc-bot { display: flex; align-items: center; gap: 8px; }
.lc-top input { width: 20px; height: 20px; }
.lc-name { font-size: 16px; }
.lc-mid { margin: 6px 0 4px; flex-wrap: wrap; }
.lc-mid .phone { font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 4px; }
.callbtn { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; padding: 9px 18px; border-radius: 10px; font-size: 15px; }
.cards .empty { padding: 40px; text-align: center; }
@media (max-width: 860px) {
  .tablecard .tablewrap { display: none; }
  .cards { display: block; }
  .facet-toggle { display: inline-flex; align-items: center; height: 40px; border-radius: 10px; }
  .facet-toggle.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .facets { display: none; }
  .facets.open { display: grid; grid-template-columns: 1fr; }
  .fcard { height: auto; max-height: 220px; }
  .seg { width: 100%; } .seg button { flex: 1; padding: 8px 4px; }
  .title { font-size: 20px; margin: 2px 0 12px; }
  .actions { flex-wrap: wrap; }
  .tablecard .pager { flex-wrap: wrap; }
  .strip { grid-auto-columns: 74px; }
  #demobar span { display: none; } #demobar { left: auto; right: 8px; bottom: 8px; padding: 4px; }
}

#demobar { position: fixed; left: 12px; bottom: 12px; z-index: 90; display: flex; gap: 6px; align-items: center; background: #fff8e1; border: 1px solid #f1d58a; color: #6b4f00; border-radius: 10px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#demobar button { font-size: 12px; padding: 3px 9px; }
body:has(.selbar.on) #demobar { bottom: 80px; }

</style>
</head>
<body>
<div id="app"></div>
<div id="watermark" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<script>
// 체험판 전용: 브라우저 안에서 서버 API 를 흉내 냅니다 (실제 서버 src/*.ts 의 규칙을 줄여 옮김).
// 데이터는 이 창을 닫거나 새로 고치면 처음으로 돌아갑니다. 번호는 모두 010-0000-xxxx 가짜입니다.
(() => {
  'use strict';
  const mem = {};
  window.SS = { getItem: (k) => { try { return sessionStorage.getItem(k); } catch { return mem[k] ?? null; } }, setItem: (k, v) => { try { sessionStorage.setItem(k, v); } catch { mem[k] = v; } }, removeItem: (k) => { try { sessionStorage.removeItem(k); } catch { delete mem[k]; } } };

  const STATUSES = ['연락대기', '상담진행중', '부재중', '장기부재', '재연락', '예약성공', '예약실패', '방문성공', '방문취소', '결제성공', '결제실패', '결번', '중복신청', '기타', '리워드'];
  const VISIT = ['방문', '부도부재', '예약취소', '최종취소'];
  const OPEN = ['연락대기', '상담진행중', '부재중', '재연락', '예약성공'];
  const p2 = (n) => String(n).padStart(2, '0');
  const stamp = (d = new Date()) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;

<script>
// DB 분배 전산망 화면 (서버가 직접 내려주는 HTML/JS, 외부 라이브러리 없음)
// - 모든 글자는 textContent 로 넣음 (innerHTML 에 데이터를 넣지 않음 → 스크립트 주입 방지)

'use strict';

const $app = document.getElementById('app');

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {

    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v; // CSP(style-src 'self'): 속성 대신 CSSOM 으로

  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));

}

async function api(method, path, body, opt = {}) {

  if (opt.raw && res.ok) return res;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = data.error || { code: 'HTTP_' + res.status, message: '요청을 처리하지 못했습니다' };
    if (res.status === 401 && path !== '/api/auth/login' && path !== '/api/auth/otp') { logoutLocal(e.message); throw Object.assign(new Error(e.message), { code: e.code, silent: true }); }

}
const run = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (!e.silent) { console.error(e); toast(e.message || '처리하지 못했습니다'); } } };

function modal(title, body, actions) {

}

  return new Promise((resolve) => {
    const inp = h('textarea', { rows: 3, placeholder });
    const err = h('div', { class: 'err' });
    modal(title, h('div', { class: 'stack' }, h('p', { class: 'muted small' }, desc), min ? inp : null, err), (close) => [
      h('button', { onclick: () => { close(); resolve(null); } }, '취소'),
      h('button', { class: danger ? 'danger' : 'primary', onclick: () => { const v = inp.value.trim(); if (min && v.length < min) { err.textContent = `${min}자 이상 적어 주세요`; return; } close(); resolve(min ? v : true); } }, okText)
    ]);
    if (min) setTimeout(() => inp.focus(), 0);
  });
}

// ---------- 워터마크 (계정명·시각) ----------
function watermark() {

  const esc = text.replace(/[<>&"']/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' })[c]);

// ---------- 로그인 ----------
function logoutLocal(msg) { S.token = ''; S.me = null; SS.removeItem('tk'); render(msg); }

function loginView(msg) {

async function callLead(id) {
  let r;
  try { r = await api('POST', `/api/leads/${id}/call`, {}); }
  catch (e) { if (e.code !== 'NIGHT_CONFIRM') throw e; if (!(await ask('야간 전화', e.message, { okText: '전화 걸기', danger: true }))) return; r = await api('POST', `/api/leads/${id}/call`, { confirmNight: true }); }
  toast(`체험판: ${r.phone} 로 전화 연결 (실제로는 전화 앱이 열리고, 기록이 남습니다)`);
}

// ---------- 날짜 ----------
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const monthAgo = () => { const d = new Date(); d.setMonth(d.getMonth() - 1); return ymd(d); };
